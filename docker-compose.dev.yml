# Development stack: two throwaway Audiobookshelf servers, each with its own
# generated fixture library. ShelfMerge itself runs on the host with
# `npm run dev` and federates both.
#
#   ./scripts/dev-up.sh      # generates fixtures, starts both, seeds them, writes config/shelfmerge.yaml
services:
  abs-a:
    image: advplyr/audiobookshelf:2.37.1
    container_name: shelfmerge-abs-a
    ports:
      - "13378:80"
    volumes:
      - ./test/fixtures/generated/Books:/audiobooks:ro
      - abs-a-config:/config
      - abs-a-metadata:/metadata
    environment:
      - TZ=UTC

  abs-b:
    image: advplyr/audiobookshelf:2.37.1
    container_name: shelfmerge-abs-b
    ports:
      - "13379:80"
    volumes:
      - ./test/fixtures/generated/Books-B:/audiobooks:ro
      - abs-b-config:/config
      - abs-b-metadata:/metadata
    environment:
      - TZ=UTC

volumes:
  abs-a-config:
  abs-a-metadata:
  abs-b-config:
  abs-b-metadata:
