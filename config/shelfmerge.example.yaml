# ShelfMerge configuration. Copy to shelfmerge.yaml and edit.

port: 3333

# Where ShelfMerge keeps its SQLite database (users, progress, bookmarks,
# id map). Relative paths are resolved from the project root; in Docker use
# the /data volume.
dataDir: /data

# Upstream Audiobookshelf servers. Each needs an API key for a dedicated
# service user on that server (Settings → API Keys, Audiobookshelf 2.26+).
# The service user's library permissions decide what ShelfMerge can see.
servers:
  home:
    url: https://abs.example.com
    apiKey: eyJhbGciOi...
    label: Home
  bob:
    url: https://abs.bob.example
    apiKey: eyJhbGciOi...
    label: Bob

# Prefix library names with the server label ("Bob: Audiobooks").
# Defaults to on when there is more than one server.
prefixLibraryNames: true

# Merged (virtual) libraries, listed first and used as the default library.
# Each combines the matching upstream libraries into one. Sources are
# "<serverKey>:*", "<serverKey>:<library name>", "<serverKey>:<library id>",
# or "*" for every library of that media type on every server.
# Omit this key for a single "Everything" over all book libraries; set
# `merged: []` to have none.
merged:
  - name: Everything
    mediaType: book
    sources: ['*']
    # Show one card when the same book exists more than once (default true).
    collapseEditions: true
    # Which copy to show, by server, most preferred first (default: config order).
    preferServers: [home, bob]
    # Item ids that must never be grouped, to pin a false match apart.
    # Groupings are logged as "[editions] ..." with the ids.
    keepSeparate: []

# People who log into ShelfMerge. Progress and bookmarks are kept per
# ShelfMerge user; upstream only ever sees the service account.
# `libraries` limits what a user sees: "<serverKey>:*", "<serverKey>:<library name>",
# "<serverKey>:<library id>", or "merged:*" / "merged:<name>" for merged
# libraries. Omit it for access to everything.
users:
  adam:
    password: change-me
  guest:
    password: change-me-too
    libraries: [merged:Everything, home:Audiobooks]
