# ShelfMerge. Point config/shelfmerge.yaml at your Audiobookshelf servers
# (see config/shelfmerge.example.yaml); secrets may be referenced as ${VAR}
# in the YAML and provided in a .env file next to this compose file.
#
#   docker compose up -d --build        # build locally
#   docker compose pull && docker compose up -d   # use the published image (after a release)
#
# Put your own reverse proxy in front of port 3333 for HTTPS. If you have
# none, deploy/docker-compose.caddy.yml adds Caddy with automatic certificates.
services:
  shelfmerge:
    build: .
    image: ghcr.io/adammhaile/shelfmerge:latest
    container_name: shelfmerge
    ports:
      - "3333:3333"
    volumes:
      - ./config:/config
      - shelfmerge-data:/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

volumes:
  shelfmerge-data:
